<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e6">
  <title>Delete, Delete, Delete — 물의 세 가지 시간</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #f5f0e6; color: #887761; font-family: sans-serif; }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
    #loading { position: fixed; top: 46%; width: 100%; text-align: center; font-size: 14px; padding: 20px; }
    #replay { position: fixed; left: 50%; bottom: 10%; transform: translateX(-50%); border: 1px solid #c5b9a5; border-radius: 30px; background: #faf7ef; color: #887761; font: inherit; font-size: 14px; padding: 11px 23px; cursor: pointer; touch-action: manipulation; }
    #replay:hover { background: #e8e1d2; }
    #replay:focus-visible { outline: 2px solid #6e9c97; outline-offset: 4px; }
    [hidden] { display: none !important; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js" onerror="document.getElementById('loading').textContent='p5.js를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.'"></script>
  <script defer src="WaterCup.js"></script>
  <script defer src="Cat.js"></script>
  <script defer src="Clock.js"></script>
  <script defer src="Particle.js"></script>
  <script defer src="sketch.js"></script>
</head>
<body>
  <main id="stage"></main>
  <p id="loading">불러오는 중…</p>
  <button id="replay" type="button" hidden>다시 시작</button>
</body>
</html>
